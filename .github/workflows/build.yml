name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kotlin APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug - List repository files
        run: |
          echo "=== Root ==="
          ls -la
          echo ""
          echo "=== gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== build.gradle files ==="
          find . -name "build.gradle*" -type f 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== settings.gradle ==="
          find . -name "settings.gradle*" -type f 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== app folder ==="
          ls -la app/ 2>/dev/null || echo "app/ ফোল্ডার নেই"

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      # Config cache বন্ধ করে build — আসল এরর স্পষ্ট দেখাবে
      - name: Build Debug APK (NO config cache)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug \
              --stacktrace \
              --no-configuration-cache \
              --no-daemon \
              --console=plain
          else
            gradle assembleDebug \
              --stacktrace \
              --no-configuration-cache \
              --no-daemon \
              --console=plain
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
