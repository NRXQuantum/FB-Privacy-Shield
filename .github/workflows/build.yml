name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # ম্যানুয়ালি রান করার জন্য

jobs:
  build:
    name: Build Kotlin APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository চেকআউট
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. JDK 17 সেটআপ (Kotlin/AGP 8+ এর জন্য)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK সেটআপ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. gradlew execute permission
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Gradle cache (বিল্ড fast করার জন্য)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Debug APK build
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Release APK build (unsigned)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 8. Debug APK upload
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # 9. Release APK upload
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
