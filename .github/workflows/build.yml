name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Kotlin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ডিবাগ: রিপোতে কী আছে তা দেখুন
      - name: Debug - List files
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== gradlew খোঁজা ==="
          find . -name "gradlew" -type f 2>/dev/null || echo "gradlew পাওয়া যায়নি"
          echo "=== build.gradle খোঁজা ==="
          find . -name "build.gradle*" -type f 2>/dev/null || echo "build.gradle পাওয়া যায়নি"

      # gradlew থাকলে executable করুন (না থাকলে স্কিপ)
      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "gradlew নেই, স্কিপ করা হচ্ছে"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle (fallback)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
